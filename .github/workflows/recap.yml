name: Recap news quotidien

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python recap.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "recap-bot"
          git config user.email "recap-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Recap du jour" || echo "Rien de nouveau"
          git pull --rebase -X theirs
          git push
